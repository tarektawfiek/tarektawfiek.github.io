#intro.vid .ix-snd{display:inline-flex}

#intro .ix-snd[aria-pressed=true] .on{display:none}#intro .ix-snd[aria-pressed=true] .off{display:inline}

#intro.end .ix-snd{opacity:0;pointer-events:none}

#intro.ask .ix-vid{opacity:1}

#intro .ix-play .ic{width:84px;height:84px;border-radius:50%;background:#F4F2EE;position:relative;box-shadow:0 0 0 0 rgba(244,242,238,.4);animation:ixRing 1.8s ease-out infinite}
#intro .ix-play .ic:after{content:"";position:absolute;left:34px;top:27px;border-left:22px solid #0A0A0B;border-top:15px solid transparent;border-bottom:15px solid transparent}
#intro.ask .ix-play{display:flex}
#intro.ask:before{content:"";position:absolute;inset:0;background:rgba(10,10,11,.45);z-index:2}
#intro.ask .ix-load{display:none}
@keyframes ixRing{0%{box-shadow:0 0 0 0 rgba(244,242,238,.45)}100%{box-shadow:0 0 0 26px rgba(244,242,238,0)}}
#intro .ix-snd{z-index:4}#intro .ix-skip{z-index:4}
@media (pointer:coarse){#intro .ix-snd{left:50%;top:auto;bottom:max(40px,calc(env(safe-area-inset-bottom) + 28px));transform:translateX(-50%);font-size:13px;padding:14px 22px}#intro.end .ix-snd{display:none}}

<style>
/* Layout: same homepage as the site, rendered from content.json so every word, image, project, visual and logo can be edited by hand in Edit mode and saved back. */
:root{
  --paper:#ffffff; --ink:#000000; --dim:#8a8a8a; --line:#e6e6e6; --wall:#0b0b0b; --on-wall:#f2f2f2; --edit:#2f6bff; --warn:#e3173e;
  --display:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --arabic:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(12px + env(safe-area-inset-top,0px));
  --gb:calc(12px + env(safe-area-inset-bottom,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:13px;margin:0;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.s{font-size:13px;font-weight:500;line-height:1.3}
.big{font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.8;margin:0;white-space:pre-line}
.pl{white-space:pre-line}

.corner{position:fixed;z-index:20;display:flex;gap:14px;color:#fff;mix-blend-mode:difference}
.tl{top:var(--gt);left:var(--gl)} .tr{top:var(--gt);right:var(--gr)}
.bl{bottom:var(--gb);left:var(--gl)} .br{bottom:var(--gb);right:var(--gr)}
.tc{top:var(--gt);left:50%;transform:translateX(-50%)}

/* hero: photo left, pitch right, vertically centred */
.open{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,88px);align-items:center;padding:clamp(64px,9vh,104px) var(--gr) clamp(56px,7vw,100px) var(--gl)}
.open figure{margin:0;position:relative}
.open img{display:block;width:100%;height:auto}
.open figcaption{display:flex;justify-content:space-between;gap:12px;padding-top:8px;color:var(--dim)}
.kicker{margin:0 0 clamp(16px,2vw,26px);color:var(--dim)}
.open h1{font-size:clamp(56px,8.2vw,150px)}
.arh{font-family:var(--arabic);font-weight:600;direction:rtl;text-align:left;font-size:clamp(20px,2.2vw,34px);margin:clamp(12px,1.4vw,20px) 0 0;line-height:1.3}
.pitch{margin:clamp(22px,2.6vw,36px) 0 0;font-size:clamp(17px,1.45vw,21px);line-height:1.5;max-width:46ch}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:clamp(22px,2.6vw,34px)}
.ctas a{display:inline-flex;align-items:center;padding:13px 20px;border:1.5px solid var(--ink);border-radius:999px;font-weight:600;font-size:14px}
.ctas a:first-child{background:var(--ink);color:var(--paper)}

/* numbers: four equal columns */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);margin:0 var(--gr) 0 var(--gl)}
.nums > div{padding:clamp(18px,2vw,28px) clamp(12px,1.4vw,22px) clamp(18px,2vw,28px) 0;border-right:1px solid var(--line);position:relative;min-width:0}
.nums > div + div{padding-left:clamp(12px,1.4vw,22px)}
.nums > div:last-child{border-right:0}
.nums b{display:block;font-weight:800;font-size:clamp(44px,5vw,88px);line-height:.85;letter-spacing:-.02em}
.nums span{display:block;margin-top:10px;color:var(--dim)}

/* markets + services */
.blk{padding:clamp(64px,8vw,110px) var(--gr) 0 var(--gl)}
.blk-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:0;color:var(--dim)}
.grid4,.grid3{display:grid;gap:0}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cell{padding:clamp(20px,2.2vw,32px) clamp(14px,1.6vw,26px) clamp(24px,2.6vw,36px) 0;border-bottom:1px solid var(--line);position:relative;min-width:0}
.grid4 .cell + .cell,.grid3 .cell:not(:nth-child(3n+1)){padding-left:clamp(14px,1.6vw,26px);border-left:1px solid var(--line)}
.cell h3{margin:0 0 10px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;font-size:clamp(22px,2.2vw,34px);line-height:.9}
.cell p{margin:0;font-size:15px;line-height:1.5;color:#333;max-width:40ch}
.cell .tag{display:block;margin-bottom:12px;color:var(--dim)}
.ar-bio{font-family:var(--arabic);direction:rtl;text-align:right;font-size:clamp(16px,1.3vw,19px);line-height:1.85;margin:0;padding:clamp(28px,3vw,44px) var(--gr) 0 var(--gl)}
.ar-bio p{margin:0 0 0 auto;max-width:70ch}

.work{border-top:1px solid var(--line);margin-top:clamp(64px,8vw,110px);padding-top:clamp(28px,4vw,48px)}
/* projects: stacked split cards, the work stays clean and uncovered */
.pj{display:grid;gap:clamp(14px,1.6vw,22px);padding:0 var(--gr) 0 var(--gl)}
.pj-i{position:sticky;top:calc(var(--gt) + 34px);border-radius:6px;overflow:hidden;background:#0d0d0d;box-shadow:0 -20px 60px rgba(0,0,0,.22)}
.pj-a{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);color:#f2f2f2;text-decoration:none;min-height:0}
.pj-i:nth-child(even) .pj-a{grid-template-columns:minmax(0,1fr) minmax(0,1.75fr)}
.pj-i:nth-child(even) .pj-img{order:2}
.pj-img{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.pj-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.pj-shade{display:none}
.pj-tx{display:flex;flex-direction:column;padding:clamp(18px,2.4vw,40px);min-width:0}
.pj-top{display:flex;justify-content:space-between;gap:16px;color:#8a8a8a}
.pj-no{font-variant-numeric:tabular-nums;letter-spacing:.04em;color:#f2f2f2}
.pj-name{margin:auto 0 0;font-weight:800;text-transform:uppercase;letter-spacing:-.015em;line-height:.84;font-size:clamp(34px,4.4vw,80px);overflow-wrap:break-word}
.pj-mark{--b:clamp(72px,8.4vw,122px);margin:auto 0 0;width:calc(var(--b) * var(--r));max-width:100%;filter:drop-shadow(0 -1px 0 rgba(255,255,255,.55)) drop-shadow(0 2px 1px rgba(0,0,0,.9)) drop-shadow(0 6px 6px rgba(0,0,0,.55)) drop-shadow(0 16px 22px rgba(0,0,0,.5))}
.pj-mark span{display:block;width:100%;height:100%;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:left center;mask-position:left center;background:linear-gradient(176deg,#ffffff 0%,#e9ecef 18%,#a9afb6 40%,#5f656c 49%,#d9dde1 53%,#f8f9fa 62%,#9aa0a7 82%,#474c52 100%);background-size:100% 100%;transition:background-position 1.2s ease}
.pj-a:hover .pj-mark span{background:linear-gradient(176deg,#ffffff 0%,#f1f3f5 22%,#b9bfc6 44%,#6c727a 52%,#e4e7ea 57%,#ffffff 66%,#a7adb4 84%,#50555b 100%)}
.pj-title{margin:clamp(16px,1.8vw,26px) 0 0;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.9;font-size:clamp(26px,2.8vw,48px)}
.pj-line{margin:clamp(12px,1.3vw,20px) 0 0;font-size:clamp(15px,1.25vw,19px);line-height:1.4;max-width:34ch;color:#bdbdbd}
.pj-bot{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,1.6vw,22px);margin-top:clamp(16px,2vw,30px)}
.pj-tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pj-tags li{padding:6px 11px;border:1px solid #333;border-radius:999px;color:#d8d8d8}
.pj-go{display:inline-flex;align-items:center;gap:10px;padding:11px 16px 11px 18px;border-radius:999px;background:#f2f2f2;color:#0b0b0b;font-weight:600;transition:gap .4s ease,background .3s ease}
.pj-go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pj-a:hover .pj-img img,.pj-a:focus-visible .pj-img img{transform:scale(1.05)}
.pj-a:hover .pj-go{gap:16px;background:#fff}
.pj-a:focus-visible{outline:2px solid #fff;outline-offset:-6px}
@media (max-width:860px){
  .pj-i{position:relative;top:auto;box-shadow:none}
  .pj-a,.pj-i:nth-child(even) .pj-a{grid-template-columns:1fr}
  .pj-i:nth-child(even) .pj-img{order:0}
  .pj-tx{padding:16px 16px 18px}
  .pj-name{margin-top:14px;font-size:clamp(34px,10vw,56px)}
  .pj-mark{--b:clamp(64px,19vw,96px);margin-top:18px}
  .pj-title{font-size:clamp(26px,8vw,40px)}
  .pj-line{font-size:15px}
  .pj-tags li{padding:5px 10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){.pj-img img{transition:none}.pj-i{position:relative;top:auto}}
.editing .pj-i{position:relative;top:auto}
/* more projects: an editorial index, hover shows the work */
.pjx{position:relative;margin:clamp(56px,7vw,110px) var(--gr) 0 var(--gl)}
.pjx-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1px solid #111}
.pjx-row{display:grid;grid-template-columns:56px minmax(0,1.3fr) minmax(0,1fr) 28px;align-items:center;gap:20px;padding:clamp(18px,2vw,26px) 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;transition:padding .45s cubic-bezier(.2,.7,.2,1),color .3s ease}
.pjx-no{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.pjx-name{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
.pjx-name b{font-weight:800;text-transform:uppercase;letter-spacing:-.015em;font-size:clamp(26px,3.2vw,52px);line-height:.9}
.pjx-name em{font-style:normal;font-weight:500;font-size:clamp(14px,1.1vw,17px);color:var(--dim)}
.pjx-tags{font-size:13px;color:var(--dim);justify-self:end;text-align:right}
.pjx-th{display:none}
.pjx-ar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transform:translateX(-6px);opacity:.35;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .3s ease}
.pjx:hover .pjx-row{color:#b9b9b9}

/* motion: numbers + services */

.svc.play .cell{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 110ms)}

  transition:transform 1s cubic-bezier(.2,.75,.15,1),opacity .8s ease;will-change:transform}
